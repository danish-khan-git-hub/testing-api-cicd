name: Build and Deploy to Sandbox

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Set up Maven 3.9.9
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.9.9

    - name: Show Java and Maven versions
      run: |
        java -version
        mvn -version

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Stamp artifact file name with commit hash
      run: |
        artifactName1=$(ls target/*.jar | head -1)
        commitHash=$(git rev-parse --short "$GITHUB_SHA")
        artifactName2=$(ls target/*.jar | head -1 | sed "s/\.jar$/-$commitHash.jar/")
        mv "$artifactName1" "$artifactName2"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Set up Maven 3.9.9
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.9.9

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: artifacts

    - name: Configure Maven credentials for Exchange
      env:
        USERNAME: ${{ secrets.anypoint_platform_username }}
        PASSWORD: ${{ secrets.anypoint_platform_password }}
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << EOF
        <settings>
          <servers>
            <server>
              <id>anypoint-exchange-v3</id>
              <username>${USERNAME}</username>
              <password>${PASSWORD}</password>
            </server>
          </servers>
        </settings>
        EOF

    - name: Publish artifact to Exchange
      run: |
        artifactName=$(ls *.jar | head -1)
        mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.1.2:deploy-file \
          -Dfile="$artifactName" \
          -DpomFile=pom.xml \
          -DgroupId=a2c4bc0c-43fc-4e6c-abd4-7c1a2fd87bd8 \
          -DartifactId=testing-api-cicd \
          -Dversion=1.0.1 \
          -Dpackaging=jar \
          -Dclassifier=mule-application \
          -DrepositoryId=anypoint-exchange-v3 \
          -Durl=https://maven.anypoint.mulesoft.com/api/v3/organizations/a2c4bc0c-43fc-4e6c-abd4-7c1a2fd87bd8/maven

    - name: Deploy to Sandbox
      env:
        USERNAME: ${{ secrets.anypoint_platform_username }}
        PASSWORD: ${{ secrets.anypoint_platform_password }}
      run: |
        artifactName=$(ls *.jar | head -1)
        mvn -B deploy -DmuleDeploy \
          -Dmule.artifact="$artifactName" \
          -Danypoint.username="$USERNAME" \
          -Danypoint.password="$PASSWORD"